version: '3.8'

services:
  products-svc-s14:
    build: ./starter
    container_name: products-container
    ports:
      - "8223:8223"
    networks:
      - final-network

  orders-service:
    build: ./orders
    container_name: orders-container
    ports:
      - "8224:8224"
    networks:
      - final-network

  api-gateway:
    image: nginx:alpine
    container_name: api-gateway-s14
    ports:
      - "8080:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - final-network

networks:
  final-network:
    driver: bridge