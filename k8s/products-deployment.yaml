apiVersion: apps/v1
kind: Deployment
metadata:
  name: products-deployment
  labels:
    app: products-svc
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: products-svc
  template:
    metadata:
      labels:
        app: products-svc
    spec:
      containers:
      - name: products-container
        # Указываем имя образа, которое соберется для твоего стартера
        image: week-17_starter:latest 
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8223
        env:
        - name: PORT
          value: "8223"
        livenessProbe:
          httpGet:
            path: /health
            port: 8223
          initialDelaySeconds: 5
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 8223
          initialDelaySeconds: 5
          periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: products-container # Важно: это DNS-имя, по нему сервис 'orders' будет искать 'starter'
spec:
  selector:
    app: products-svc
  ports:
    - protocol: TCP
      port: 8223
      targetPort: 8223