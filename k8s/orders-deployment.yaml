apiVersion: apps/v1
kind: Deployment
metadata:
  name: orders-deployment
  labels:
    app: orders-svc
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: orders-svc
  template:
    metadata:
      labels:
        app: orders-svc
    spec:
      containers:
      - name: orders-container
        image: week-17_orders:latest 
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8224
        env:
        - name: PRODUCTS_SERVICE_URL
          value: "http://products-container:8223/api/products" 
        livenessProbe:
          httpGet:
            path: /health
            port: 8224
          initialDelaySeconds: 5
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 8224
          initialDelaySeconds: 5
          periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: orders-container
spec:
  selector:
    app: orders-svc
  ports:
    - protocol: TCP
      port: 8224
      targetPort: 8224